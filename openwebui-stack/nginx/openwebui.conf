# Один вход: HTTPS :443. Контейнеры только на 127.0.0.1.
# Пути: /  /openwebui→/  /stack.html  /qdrant/  /portainer/  /filer/
#
# Open WebUI нельзя повесить на /openwebui/: статика и API всегда с корня (/_app, /api).
# S3 SeaweedFS на путь не выносится: у S3 первый сегмент — имя бакета.
#
# Аутентификация (не смешивать):
#   /              — логин Open WebUI (без HTTP Basic)
#   /portainer/    — логин Portainer (без HTTP Basic)
#   /qdrant/ /filer/ — nginx Basic, файл /etc/nginx/admins.htpasswd
# Подробно: ../FAQ.md и ../RU-FAQ.md

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # ssl_certificate     /etc/ssl/certs/openwebui.crt;
    # ssl_certificate_key /etc/ssl/private/openwebui.key;
    ssl_certificate /etc/ssl/certs/openwebui.crt;
    ssl_certificate_key /etc/ssl/private/openwebui.key;
    # Новая ВМ: можно заменить на /etc/ssl/openwebui/server-fullchain.crt и server.key
    # Варианты настройки см. ../FAQ.md и ../RU-FAQ.md
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /openwebui {
        return 301 /;
    }
    location = /openwebui/ {
        return 301 /;
    }

    location = /stack {
        return 301 /stack.html;
    }
    location = /stack/ {
        return 301 /stack.html;
    }
    location = /stack.html {
        root /var/www/html;
    }

    location = /qdrant {
        include /etc/nginx/snippets/auth-admins.conf;
        return 301 /qdrant/dashboard;
    }
    location = /qdrant/ {
        include /etc/nginx/snippets/auth-admins.conf;
        return 301 /qdrant/dashboard;
    }
    location /qdrant/ {
        include /etc/nginx/snippets/auth-admins.conf;
        include /etc/nginx/snippets/qdrant-apikey.conf;
        proxy_pass http://127.0.0.1:6333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /portainer {
        return 301 /portainer/;
    }
    location /portainer/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /filer {
        include /etc/nginx/snippets/auth-admins.conf;
        return 301 /filer/;
    }
    location /filer/ {
        include /etc/nginx/snippets/auth-admins.conf;
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
